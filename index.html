<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Cakeashown🍰ྀི</title>
</head>
<body>

    <!-- Outer Wrapper controls items floating completely outside the white box -->
    <div class="header-outer-wrapper">
        
        <!-- Left Side Floating Sticker -->
        <img src="images/heart.gif" alt="heart" class="strawbaby">  

        <!-- Main Banner Header Box Container -->
        <header class="banner-header">
            
            <!-- 1. The Animal Banner Image (Far Left) -->
            <img src="images/header.jpg" alt="Cute Banner" class="header-banner-pic">
            
            <!-- 2. The Heart Sticker (Sits inline safely) -->
            <img src="images/pixelheart.gif" alt="Heart Sticker" class="sticker-heart">
            
            <!-- 3. Title Text Group (Locks directly inside the empty white space) -->
            <div class="text-group">
                <h1 class="banner-title">cakeashown</h1>
                <p class="banner-subtitle">welcome to my little corner of the web ✨</p>
            </div>
            
        </header>

        <!-- Right Side Floating Sticker (Moved outside the header where it belongs) -->
        <img src="images/bunnygif.gif" alt="Cute Grey Bunny" class="side-bunny bunny-right">

    </div> <!-- Outer wrapper closes cleanly here -->
        
    <!-- Blinkie Row -->
    <div class="blinkie-row">
        <img src="blinkies/blinkiesCafe-3T.gif" alt="Blinkie 1">
        <img src="blinkies/blinkiesCafe-wV.gif" alt="Blinkie 2">
        <img src="blinkies/blinkiesCafe-eD.gif" alt="Blinkie 3">
        <img src="blinkies/blinkiesCafe-Hp.gif" alt="Blinkie 4">
        <img src="blinkies/blinkiesCafe-ZA.gif" alt="blinkie 5">
    </div>

</body>
</html>
